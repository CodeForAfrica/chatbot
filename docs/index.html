<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="description" content="Ask live air-quality questions about African cities — powered by the sensors.africa network.">
<title>sensors.africa — Air Quality Chat</title>
<style>
  :root {
    --bg: #f2efe9;
    --ink: #1f2a24;
    --brand: #0b3d2e;
    --brand-2: #14614a;
    --bot: #ffffff;
    --user: #d7ecdf;
    --muted: #6b7a72;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--brand);
    color: #f5f1e6;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  header .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #7fd8a4; box-shadow: 0 0 0 4px rgba(127,216,164,.25);
    flex: none;
  }
  header h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: .2px; }
  header p { font-size: .78rem; opacity: .85; font-style: italic; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px 12px 8px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 86%; padding: 10px 14px; border-radius: var(--radius);
    line-height: 1.45; font-size: .95rem; white-space: pre-wrap;
    word-wrap: break-word; animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .bot  { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 6px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .user { background: var(--user); align-self: flex-end; border-bottom-right-radius: 6px; }
  .typing { color: var(--muted); font-style: italic; }
  #chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px;
    scrollbar-width: none;
  }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--brand-2); color: var(--brand-2);
    background: transparent; border-radius: 999px; padding: 7px 14px;
    font-size: .82rem; font-family: inherit; cursor: pointer;
  }
  .chip:active { background: var(--user); }
  form {
    display: flex; gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    background: var(--bg); border-top: 1px solid #ddd6c8;
  }
  input[type=text] {
    flex: 1; padding: 12px 16px; border: 1px solid #cfc7b6;
    border-radius: 999px; font-size: 16px; font-family: inherit;
    background: #fff; outline: none;
  }
  input[type=text]:focus { border-color: var(--brand-2); }
  button[type=submit] {
    background: var(--brand); color: #fff; border: 0; border-radius: 999px;
    width: 46px; height: 46px; font-size: 1.1rem; cursor: pointer; flex: none;
  }
  button[type=submit]:disabled { opacity: .5; }
  footer.credit {
    text-align: center; font-size: .7rem; color: var(--muted);
    padding: 0 12px 6px; background: var(--bg);
  }
  footer.credit a { color: var(--brand-2); }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <div>
    <h1>sensors.africa air quality</h1>
    <p>ask the sensors anything — no app, no server</p>
  </div>
</header>

<div id="chat" aria-live="polite"></div>

<div id="chips">
  <!-- Always-safe chips render immediately. City-specific chips (a single-city
       query, a kids/health query, and a comparison) are inserted before these
       once live data arrives — see buildCityChips() — so tapping a suggestion
       never lands on a city with no readings. -->
  <button class="chip">Most polluted city right now</button>
  <button class="chip">What is PM2.5?</button>
  <button class="chip">List cities</button>
</div>

<form id="composer" autocomplete="off">
  <input id="box" type="text" placeholder="Ask about the air in your city…"
         maxlength="500" aria-label="Message">
  <button type="submit" aria-label="Send">➤</button>
</form>
<footer class="credit">
  Live data from <a href="https://sensors.africa" rel="noopener">sensors.africa</a>,
  a Code for Africa project · runs entirely in your browser
</footer>

<script>
"use strict";
/* ============================================================
   sensors.africa chatbot — fully client-side edition.
   Everything (intent parsing, statistics, AQI, health advice)
   runs in the browser. Data comes from the PUBLIC, no-auth
   static aggregate files (data.dust.min.json / data.1h.json /
   data.24h.json) plus the public /v2/cities/ list — never the
   authenticated /v2/data/ endpoint. Host this file anywhere
   static (GitHub Pages works) and you have a working chatbot.
   URL params: ?q=<question> auto-asks on load;
               ?api=<base-url> overrides the API base (for testing).
   ============================================================ */

const PARAMS = new URLSearchParams(location.search);
const API_BASE = PARAMS.get("api") || "https://api.sensors.africa";
// Public, no-auth static aggregates. The /v2/data/ endpoint is deliberately
// NOT used: it ignores ?city= (its filter is location__city) and requires
// authentication in production (403). These pre-averaged files don't.
const DUST_URL   = API_BASE + "/static/v2/data.dust.min.json"; // 5-min PM averages (primary)
const HOUR_URL   = API_BASE + "/static/v2/data.1h.json";        // 1-hour averages (fallback)
const DAY_URL    = API_BASE + "/static/v2/data.24h.json";       // 24-hour averages (trend context)
const CITIES_URL = API_BASE + "/v2/cities/";                    // public, paginated
const CACHE_TTL_MS = 5 * 60 * 1000;

// Seed list so fuzzy city matching still works if /v2/cities/ is unreachable.
// At load time ensureCitiesLoaded() replaces CITY_NAMES with the live list and
// builds CITY_LOOKUP (alias -> canonical display label, e.g. "kano" -> "Kano").
const SEED_CITIES = [
  "Nairobi","Lagos","Dar es Salaam","Accra","Kampala","Addis Ababa",
  "Johannesburg","Cape Town","Durban","Pretoria","Abuja","Port Harcourt",
  "Mombasa","Kisumu","Nakuru","Dodoma","Arusha","Mwanza","Bamako",
  "Yaoundé","Douala","Kinshasa","Lubumbashi","Abidjan","Dakar",
  "Ouagadougou","Lomé","Cotonou","Kigali","Bujumbura","Lusaka",
  "Harare","Gaborone","Windhoek","Maputo","Antananarivo","Port Louis",
  "Cairo","Alexandria","Tunis","Algiers","Casablanca","Monrovia",
  "Freetown","Banjul","Niamey","N'Djamena","Juba","Khartoum","Asmara",
  "Djibouti","Mogadishu","Lilongwe","Blantyre","Beira","Stone Town","Kano"
];
let CITY_NAMES = SEED_CITIES.slice();  // names/labels used for extraction + fuzzy matching
let CITY_LOOKUP = new Map();           // strip(alias) -> canonical display label

/* ---------- AQI (US EPA breakpoints; 2024 PM2.5 revision) ---------- */

const PM25_BP = [[0.0,9.0,0,50],[9.1,35.4,51,100],[35.5,55.4,101,150],
                 [55.5,125.4,151,200],[125.5,225.4,201,300],[225.5,500.4,301,500]];
const PM10_BP = [[0,54,0,50],[55,154,51,100],[155,254,101,150],
                 [255,354,151,200],[355,424,201,300],[425,604,301,500]];
const CATEGORIES = [[50,"Good","🟢"],[100,"Moderate","🟡"],
  [150,"Unhealthy for sensitive groups","🟠"],[200,"Unhealthy","🔴"],
  [300,"Very unhealthy","🟣"],[500,"Hazardous","🟤"]];
const WHO_PM25 = 15, WHO_PM10 = 45;

const ADVICE = {
  general: [
    "Air quality is good — enjoy outdoor activities.",
    "Air quality is acceptable. Unusually sensitive people should consider shorter outdoor exertion.",
    "Sensitive groups (children, elderly, people with asthma or heart conditions) should reduce prolonged outdoor exertion.",
    "Everyone should reduce prolonged outdoor exertion. Sensitive groups should stay indoors where possible.",
    "Avoid outdoor exertion. Keep windows closed; wear a well-fitting mask (e.g. N95) if you must go out.",
    "Health emergency conditions. Everyone should stay indoors with windows closed."
  ],
  children: [
    "It's a good time for kids to walk, play and be outside.",
    "Fine for the walk to school. If your child has asthma, keep their inhaler handy.",
    "Limit your child's time outdoors and choose calmer activities. Children breathe faster and take in more polluted air.",
    "Keep children indoors where possible; if they must be outside, keep it brief and avoid busy roads.",
    "Keep children indoors with windows closed. A well-fitting mask helps for unavoidable trips.",
    "Keep children indoors. Seek medical help promptly if a child has trouble breathing."
  ],
  exercise: [
    "Great conditions for a run or outdoor workout.",
    "Fine for exercise. Very sensitive people may prefer lighter sessions.",
    "Consider a shorter or less intense workout, ideally away from traffic, or exercise indoors.",
    "Move your workout indoors — heavy breathing multiplies the pollution dose.",
    "Do not exercise outdoors.",
    "Do not exercise outdoors."
  ],
  outdoor_workers: [
    "Normal working conditions.",
    "Normal working conditions for most people.",
    "Take more breaks away from traffic; workers with asthma should keep medication close.",
    "Reduce heavy outdoor labour where possible; a well-fitting mask (N95) helps.",
    "Limit outdoor shifts and wear a well-fitting respirator mask.",
    "Outdoor work should stop except for emergencies."
  ]
};

function interpolate(conc, bps) {
  const top = bps[bps.length - 1];
  if (conc >= top[1]) return top[3];
  for (const [cl, ch, al, ah] of bps) {
    if (conc >= cl && conc <= ch) return Math.round((ah - al) / (ch - cl) * (conc - cl) + al);
  }
  return 0;
}
function categoryFor(aqi) {
  for (let i = 0; i < CATEGORIES.length; i++) {
    if (aqi <= CATEGORIES[i][0]) return {index: i, name: CATEGORIES[i][1], emoji: CATEGORIES[i][2]};
  }
  return {index: 5, name: "Hazardous", emoji: "🟤"};
}
function aqiFrom(pm25, pm10) {
  const results = [];
  if (pm25 != null) results.push({aqi: interpolate(Math.max(0, Math.round(pm25*10)/10), PM25_BP), pollutant: "PM2.5"});
  if (pm10 != null) results.push({aqi: interpolate(Math.max(0, Math.round(pm10)), PM10_BP), pollutant: "PM10"});
  if (!results.length) return null;
  const worst = results.reduce((a, b) => b.aqi > a.aqi ? b : a);
  return Object.assign(worst, categoryFor(worst.aqi));
}
function whoLine(pm25, pm10) {
  const parts = [];
  if (pm25 != null) parts.push(pm25 > WHO_PM25
    ? `PM2.5 is ${(pm25/WHO_PM25).toFixed(1)}× the WHO daily guideline (${WHO_PM25} µg/m³)`
    : "PM2.5 is within the WHO daily guideline");
  if (pm10 != null) parts.push(pm10 > WHO_PM10
    ? `PM10 is ${(pm10/WHO_PM10).toFixed(1)}× the WHO daily guideline (${WHO_PM10} µg/m³)`
    : "PM10 is within the WHO daily guideline");
  return parts.length ? parts.join("; ") + "." : "";
}

/* ---------- data layer (static aggregates → per-city averages) ----------
   Each static file (5-min dust, 1-hour, 24-hour) is grouped by location.city
   into sample-weighted PM2.5 (P2) / PM10 (P1) means. For a given city we
   cascade freshest-first — 5-min, then 1-hour, then 24-hour — and lazily
   fetch the coarser files only when a finer one lacks the requested city.
   Each file is cached for CACHE_TTL_MS. */

const cache = new Map();
function cacheGet(key) {
  const hit = cache.get(key);
  if (hit && Date.now() - hit.t < CACHE_TTL_MS) return hit.v;
  return null;
}

const rnd1 = x => Math.round(x * 10) / 10;
const titleCase = s => String(s || "").replace(/\b\w/g, c => c.toUpperCase());

// Discard garbage: non-numeric, negative, or absurd (PM2.5 capped at 1000).
function num(v, cap) {
  const f = typeof v === "number" ? v : parseFloat(v);
  if (!isFinite(f) || f < 0 || f > cap) return null;
  return f;
}

// fetch that fails loudly and distinguishably: a CORS/network rejection is
// tagged kind:"cors" so the UI can name it; an HTTP status → kind:"http".
async function fetchJson(url) {
  let res;
  try {
    res = await fetch(url, {headers: {Accept: "application/json"}});
  } catch (e) {
    const err = new Error("CORS or network failure"); err.kind = "cors"; err.url = url; throw err;
  }
  if (!res.ok) { const err = new Error("HTTP " + res.status); err.kind = "http"; err.status = res.status; err.url = url; throw err; }
  return res.json();
}

// One static record → {city, country, P2, P2s (samples), P1, P1s} or null.
function parseRecord(rec) {
  if (!rec || typeof rec !== "object") return null;
  const loc = rec.location || {};
  const city = String(loc.city || "").trim();
  if (!city) return null;
  let P2 = null, P2s = 0, P1 = null, P1s = 0;
  for (const d of rec.sensordatavalues || []) {
    if (!d || d.value_type == null) continue;
    if (d.value_type === "P2") { const v = num(d.value, 1000); if (v != null) { P2 = v; P2s = Number(d.samples) || 0; } }
    else if (d.value_type === "P1") { const v = num(d.value, 2000); if (v != null) { P1 = v; P1s = Number(d.samples) || 0; } }
  }
  if (P2 == null && P1 == null) return null;
  return { city, country: String(loc.country || "").trim(), P2, P2s, P1, P1s };
}

// Group records by canonical city → sample-weighted P2/P1 means + range.
function groupByCity(records) {
  const acc = new Map();
  for (const rec of records || []) {
    const p = parseRecord(rec);
    if (!p) continue;
    const rawKey = strip(p.city);
    if (!rawKey) continue;
    const display = CITY_LOOKUP.get(rawKey) || titleCase(p.city);
    const key = strip(display);
    let g = acc.get(key);
    if (!g) { g = {display, country: "", key, p2sum: 0, p2w: 0, p1sum: 0, p1w: 0, p2vals: [], sensors: 0}; acc.set(key, g); }
    g.sensors++;
    if (!g.country && p.country) g.country = p.country;
    if (p.P2 != null) { const w = p.P2s || 1; g.p2sum += p.P2 * w; g.p2w += w; g.p2vals.push(p.P2); }
    if (p.P1 != null) { const w = p.P1s || 1; g.p1sum += p.P1 * w; g.p1w += w; }
  }
  const out = new Map();
  for (const [key, g] of acc) {
    out.set(key, {
      display: g.display, country: g.country, key, sensors: g.sensors,
      pm25: g.p2w ? rnd1(g.p2sum / g.p2w) : null,
      pm10: g.p1w ? rnd1(g.p1sum / g.p1w) : null,
      pm25min: g.p2vals.length ? rnd1(Math.min(...g.p2vals)) : null,
      pm25max: g.p2vals.length ? rnd1(Math.max(...g.p2vals)) : null
    });
  }
  return out;
}

// Load the public /v2/cities/ list once (paginated) to replace the seed list
// and build the alias→label lookup. Best-effort: on failure we keep the seed.
let citiesLoaded = false;
async function ensureCitiesLoaded() {
  if (citiesLoaded) return;
  citiesLoaded = true;  // set first so a failure doesn't refetch on every message
  try {
    const names = new Set(SEED_CITIES);
    const lookup = new Map();
    let url = CITIES_URL, guard = 0;
    while (url && guard++ < 15) {
      const payload = await fetchJson(url);
      const items = Array.isArray(payload) ? payload : (payload.results || []);
      for (const it of items) {
        if (!it) continue;
        const name = (it.name || "").trim(), slug = (it.slug || "").trim(), label = (it.label || "").trim();
        const display = label || name || slug;
        if (!display) continue;
        names.add(display);
        for (const alias of [name, slug, label, display]) if (alias) lookup.set(strip(alias), display);
      }
      url = Array.isArray(payload) ? null : (payload.next || null);
    }
    CITY_NAMES = [...names];
    CITY_LOOKUP = lookup;
  } catch (e) {
    // /v2/cities/ unreachable or CORS-blocked — seed list keeps matching working.
  }
}

// Group one window's static file, cached per CACHE_TTL_MS. Lazily fetched:
// citySnapshot only reaches for a coarser window when a finer one lacks the
// city. Throws on fetch failure (cors/http) so callers decide skip vs report.
const WINDOW_URL = {"5min": DUST_URL, "1h": HOUR_URL, "24h": DAY_URL};

async function getGrouped(which) {
  const ck = "grp:" + which;
  const hit = cacheGet(ck);
  if (hit) return hit;
  await ensureCitiesLoaded();
  const records = await fetchJson(WINDOW_URL[which]);
  const map = groupByCity(Array.isArray(records) ? records : []);
  cache.set(ck, {t: Date.now(), v: map});
  return map;
}

// Map a user's city string to a grouped-map key via the alias lookup.
function cityKey(input) {
  const s = strip(input);
  const display = CITY_LOOKUP.get(s) || input;
  return strip(display);
}

// True if the city is in the loaded /v2/cities/ list, so we can say "sensors
// appear offline" instead of "may not be in the network". False if the cities
// list didn't load (then we can't tell, and use the softer phrasing).
function cityInNetwork(input) {
  return CITY_LOOKUP.has(strip(input));
}

// Merge all reachable windows into one per-city view, freshest window winning
// (5-min > 1-hour > 24-hour). Used by rankings. Skips a window that errors;
// re-throws a CORS failure so the UI can report it.
async function combinedCityMap() {
  const merged = new Map();
  for (const which of ["5min", "1h", "24h"]) {
    let map;
    try { map = await getGrouped(which); }
    catch (e) { if (e && e.kind === "cors") throw e; continue; }
    for (const [key, g] of map) {
      if (merged.has(key)) continue;                 // a finer window already set this city
      if (g.pm25 == null && g.pm10 == null) continue;
      merged.set(key, Object.assign({}, g, {window: which}));
    }
  }
  return merged;
}

// Distinct display names of every city reporting in any window.
async function citiesWithData() {
  const names = new Set();
  for (const which of ["5min", "1h", "24h"]) {
    let map;
    try { map = await getGrouped(which); }
    catch (e) { if (e && e.kind === "cors") throw e; continue; }
    for (const g of map.values()) if (g.pm25 != null || g.pm10 != null) names.add(g.display);
  }
  return [...names].sort();
}

/* ---------- NLU ---------- */

const strip = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m || !n) return Math.max(m, n);
  let prev = Array.from({length: n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

function extractCities(msg) {
  const norm = strip(msg);
  const found = [];
  for (const city of CITY_NAMES) {
    const idx = norm.indexOf(strip(city));
    if (idx >= 0) found.push([idx, city]);
  }
  if (!found.length) {
    const words = norm.match(/[a-z][a-z'-]{3,}/g) || [];
    for (let i = 0; i < words.length; i++) {
      for (const city of CITY_NAMES) {
        if (city.includes(" ")) continue;
        const c = strip(city);
        const dist = levenshtein(words[i], c);
        if (dist > 0 && dist <= Math.floor(c.length / 5) + 1 && words[i].length > 3
            && 1 - dist / Math.max(c.length, words[i].length) >= 0.8) {
          found.push([i, city]);
        }
      }
    }
  }
  const seen = new Set(), out = [];
  for (const [, city] of found.sort((a, b) => a[0] - b[0])) {
    if (!seen.has(city)) { seen.add(city); out.push(city); }
  }
  return out.slice(0, 2);
}

const RX = {
  greeting: /^\s*(hi|hello|hey|hallo|habari|jambo|mambo|sasa|salut|bonjour|good\s*(morning|afternoon|evening)|start)\b/i,
  help: /\b(help|menu|options|what can you do|how do(es)? this work)\b/i,
  thanks: /\b(thanks?|thank you|asante|merci|shukran)\b/i,
  compare: /\b(compare|versus|vs\.?|difference between|worse than|better than|cleaner than)\b/i,
  worst: /\b(worst|most polluted|dirtiest|highest pollution|highest pm)\b/i,
  best: /\b(best|cleanest|least polluted|lowest pollution|lowest pm)\b/i,
  trend: /\b(trend(s|ing)?|improv\w*|getting (better|worse)|chang(e|es|ing|ed)|over time|history|past|earlier|yesterday)\b/i,
  cities: /\b(which|what|list)\b.*\b(cities|city|places|locations)\b|\bcities\b\s*$/i,
  explain: /\b(what is|what's|whats|explain|meaning of|define)\b/i,
  air: /\b(air|aqi|pollution|pm\s?2\.?5|pm\s?10|dust|smog|quality|breathe|breathing)\b/i,
  health: /\b(safe|ok to|okay to|should i|can i|advice|health|mask|asthma|risk|danger|harmful)\b/i
};
const AUDIENCES = [
  ["children", /\b(child|children|kid|kids|school|baby|toddler|son|daughter)\b/i],
  ["exercise", /\b(run|running|jog|jogging|exercise|workout|cycle|cycling|sport|training|gym)\b/i],
  ["outdoor_workers", /\b(work outside|outdoor work|trader|market|vendor|boda|farmer|construction|hawker)\b/i]
];
const TOPICS = [
  ["pm25", /pm\s?2\.?5/i], ["pm10", /pm\s?10/i],
  ["aqi", /\baqi\b|air quality index/i], ["sensors", /\bsensor(s)?\b|sensors\.africa|network/i]
];

function parseIntent(message, lastCity) {
  const text = (message || "").trim();
  if (!text) return {name: "help"};
  const cities = extractCities(text);
  const city = cities[0] || null, second = cities[1] || null;
  let audience = "general";
  for (const [name, rx] of AUDIENCES) if (rx.test(text)) { audience = name; break; }

  if (RX.greeting.test(text) && text.length < 40 && !city) return {name: "greeting"};
  if (RX.help.test(text)) return {name: "help"};
  if (RX.thanks.test(text) && text.length < 40) return {name: "thanks"};
  if (RX.compare.test(text) && (second || (city && lastCity && city !== lastCity)))
    return {name: "compare", city, second: second || lastCity};
  if (RX.worst.test(text) && !city) return {name: "rank", order: "worst"};
  if (RX.best.test(text) && !city) return {name: "rank", order: "best"};
  if (RX.cities.test(text) && !city) return {name: "list_cities"};
  const eff = city || lastCity;
  if (RX.trend.test(text) && (eff || RX.air.test(text))) return {name: "trend", city: eff};
  if (RX.health.test(text) && (eff || RX.air.test(text) || audience !== "general"))
    return {name: "health", city: eff, audience};
  if (RX.explain.test(text)) {
    for (const [topic, rx] of TOPICS) if (rx.test(text)) return {name: "explain", topic};
    if (!city) return {name: "unknown"};
  }
  if (city) return {name: "air_quality", city, audience};
  if (RX.air.test(text)) return lastCity
    ? {name: "air_quality", city: lastCity, audience}
    : {name: "ask_city"};
  return {name: "unknown"};
}

/* ---------- responder ---------- */

const HELP_TEXT =
  'I turn live air-quality data from sensors.africa into plain answers. Try:\n' +
  '• "Air quality in Nairobi"\n' +
  '• "Is it safe for my kids to walk to school in Lagos?"\n' +
  '• "Compare Nairobi and Kampala"\n' +
  '• "Which city is most polluted right now?"\n' +
  '• "Is the air in Accra getting better?"\n' +
  '• "What is PM2.5?"\n' +
  '• "List cities"';

const EXPLAINERS = {
  pm25: "PM2.5 is fine dust smaller than 2.5 micrometres — about 30× thinner than a human hair. It comes from traffic, cooking fires, dust and burning waste, and it's the most dangerous common pollutant because it goes deep into the lungs and bloodstream. The WHO says 24-hour average exposure should stay under 15 µg/m³. Ask me for a city to see live PM2.5 levels.",
  pm10: "PM10 is inhalable dust smaller than 10 micrometres — think road dust, construction and smoke. It irritates the nose, throat and lungs. The WHO guideline is a 24-hour average under 45 µg/m³. Ask me for a city to see live PM10 levels.",
  aqi: "The Air Quality Index turns pollution measurements into one 0–500 score: 🟢 0–50 good, 🟡 51–100 moderate, 🟠 101–150 unhealthy for sensitive groups, 🔴 151–200 unhealthy, 🟣 201–300 very unhealthy, 🟤 301+ hazardous. I calculate it from live PM2.5 and PM10 sensor readings.",
  sensors: "sensors.africa is a citizen-science network of low-cost air-quality sensors across African cities, run by Code for Africa. The sensors report dust levels (PM2.5 and PM10) every few minutes, and I read that live feed to answer your questions. Data: api.sensors.africa"
};

let lastCity = null;

// Windows, freshest first. `basis` is the phrase shown to the user so they
// always know which time window an answer came from.
const WINDOWS = [
  {which: "5min", basis: "5-minute average"},
  {which: "1h",   basis: "hourly average — no readings in the last 5 minutes"},
  {which: "24h",  basis: "average over the last 24 hours — no readings in the last hour"}
];
const WHUMAN = {"5min": "5-minute", "1h": "hourly", "24h": "24-hour"};
const WTAG   = {"5min": "", "1h": " (hourly)", "24h": " (24h)"};

function noData(city, inNetwork) {
  const why = inNetwork
    ? "Its sensors appear to be offline — no readings in the last 5 minutes, hour, or 24 hours."
    : "Its sensors may be offline, or it may not be in the network yet.";
  return `I couldn't find recent readings for ${city}. ${why} ` +
    'Send "list cities" to see where data is coming in right now.';
}

// A city's snapshot, cascading freshest-first across the three windows. Only
// fetches a coarser window when the finer one lacks the city. A window whose
// file errors is skipped; a CORS failure is re-thrown for the UI to report.
async function citySnapshot(cityInput) {
  const key = cityKey(cityInput);
  for (const w of WINDOWS) {
    let map;
    try { map = await getGrouped(w.which); }
    catch (e) { if (e && e.kind === "cors") throw e; continue; }
    const g = map.get(key);
    if (g && (g.pm25 != null || g.pm10 != null)) {
      return {
        s: {city: g.display, country: g.country, sensors: g.sensors,
            pm25: g.pm25, pm10: g.pm10, pm25min: g.pm25min, pm25max: g.pm25max,
            window: w.which, basis: w.basis},
        a: aqiFrom(g.pm25, g.pm10)
      };
    }
  }
  return null;
}

async function answer(message) {
  await ensureCitiesLoaded();  // so extraction knows the live city list
  const intent = parseIntent(message, lastCity);
  if (intent.city) lastCity = intent.city;

  switch (intent.name) {
    case "greeting":
      return '👋 Hello! I\'m the sensors.africa air-quality bot. Ask me about the air in your city — for example "How is the air in Nairobi?" or "Is it safe to run in Lagos today?" Send "help" for more examples.';
    case "help": return HELP_TEXT;
    case "thanks": return "You're welcome! Breathe easy 🌍 Ask me anytime.";
    case "ask_city":
      return 'Which city are you asking about? For example: "air quality in Nairobi". Send "list cities" to see where we have sensors.';
    case "explain": return EXPLAINERS[intent.topic] || HELP_TEXT;

    case "list_cities": {
      const live = await citiesWithData();
      if (live.length)
        return `Cities reporting data right now: ${live.slice(0, 25).join(", ")}${live.length > 25 ? ", …" : ""}.\nAsk me about any of them, e.g. "air in ${live[0]}".`;
      return "I couldn't load live readings just now. Cities in the network include: " + CITY_NAMES.slice(0, 25).join(", ") + ".";
    }

    case "air_quality": {
      const snap = await citySnapshot(intent.city);
      if (!snap) return noData(intent.city, cityInNetwork(intent.city));
      const {s, a} = snap;
      const lines = [`📍 ${s.city}`];
      if (a) lines.push(`${a.emoji} AQI ${a.aqi} — ${a.name}`);
      if (s.pm25 != null) lines.push(`PM2.5: ${s.pm25} µg/m³` +
        (s.sensors > 1 ? ` (range ${s.pm25min}–${s.pm25max} across ${s.sensors} sensors)` : ` (${s.sensors} sensor)`));
      if (s.pm10 != null) lines.push(`PM10: ${s.pm10} µg/m³`);
      const who = whoLine(s.pm25, s.pm10);
      if (who) lines.push(who);
      if (a) lines.push("💡 " + ADVICE[intent.audience || "general"][a.index]);
      lines.push(`(${s.basis})`);
      return lines.join("\n");
    }

    case "health": {
      if (!intent.city) return 'Which city are you asking about? For example: "is it safe to run in Nairobi?"';
      const snap = await citySnapshot(intent.city);
      if (!snap || !snap.a) return noData(intent.city, cityInNetwork(intent.city));
      const {s, a} = snap;
      return `📍 ${s.city}: ${a.emoji} AQI ${a.aqi} — ${a.name} (PM2.5 ${s.pm25} µg/m³)\n💡 ${ADVICE[intent.audience][a.index]}\n(${s.basis})`;
    }

    case "trend": {
      if (!intent.city) return 'Which city are you asking about? For example: "is the air in Nairobi improving?"';
      const snap = await citySnapshot(intent.city);
      if (!snap || snap.s.pm25 == null) return noData(intent.city, cityInNetwork(intent.city));
      const cur = snap.s.pm25;
      if (snap.s.window === "24h")
        return `The freshest data I have for ${intent.city} is the 24-hour average (PM2.5 ${cur} µg/m³) — there are no readings in the last hour, so I can't compare a shorter-term trend yet.`;
      let dayMap;
      try { dayMap = await getGrouped("24h"); }
      catch (e) { if (e && e.kind === "cors") throw e; dayMap = null; }
      const dayG = dayMap && dayMap.get(cityKey(intent.city));
      const day = dayG ? dayG.pm25 : null;
      if (day == null)
        return `${intent.city} is at PM2.5 ${cur} µg/m³ (${snap.s.basis}), but I don't have enough 24-hour data to compare a trend yet.`;
      const pct = day ? Math.round((cur - day) / day * 100) : 0;
      let verdict;
      if (Math.abs(pct) < 10) verdict = `➡️ in line with today's 24-hour average (${day} µg/m³)`;
      else if (cur > day) verdict = `📈 above today's 24-hour average of ${day} µg/m³ — worse than usual right now`;
      else verdict = `📉 below today's 24-hour average of ${day} µg/m³ — better than usual right now`;
      const curLabel = snap.s.window === "5min" ? "latest" : "latest hourly";
      return `PM2.5 in ${intent.city} is ${cur} µg/m³ (${snap.s.basis}), ${verdict} (${pct > 0 ? "+" : ""}${pct}%). This compares the ${curLabel} network average against the last 24 hours, not a long-term climate trend.`;
    }

    case "compare": {
      if (!intent.city || !intent.second)
        return 'Tell me two cities to compare, e.g. "compare Nairobi and Lagos".';
      const [sa, sb] = await Promise.all([citySnapshot(intent.city), citySnapshot(intent.second)]);
      if (!sa) return noData(intent.city, cityInNetwork(intent.city));
      if (!sb) return noData(intent.second, cityInNetwork(intent.second));
      const lines = ["⚖️ Air quality comparison (mean PM2.5):"];
      for (const {s, a} of [sa, sb])
        lines.push(`${a ? a.emoji : "•"} ${s.city}: ${s.pm25} µg/m³ (${a ? "AQI " + a.aqi : "AQI n/a"})${WTAG[s.window]}`);
      if (sa.s.pm25 != null && sb.s.pm25 != null) {
        if (Math.abs(sa.s.pm25 - sb.s.pm25) < 2) lines.push("Both cities currently have similar air.");
        else {
          const [clean, dirty] = sa.s.pm25 < sb.s.pm25 ? [sa.s, sb.s] : [sb.s, sa.s];
          const ratio = clean.pm25 ? (dirty.pm25 / clean.pm25).toFixed(1) : null;
          lines.push(`${clean.city} currently has cleaner air` + (ratio ? ` — about ${ratio}× lower PM2.5.` : "."));
        }
      }
      if (sa.s.window !== sb.s.window)
        lines.push(`Note: ${sa.s.city}'s figure is the ${WHUMAN[sa.s.window]} average and ${sb.s.city}'s is the ${WHUMAN[sb.s.window]} average, so they cover different time windows.`);
      return lines.join("\n");
    }

    case "rank": {
      const merged = await combinedCityMap();
      const ranked = [...merged.values()].filter(g => g.pm25 != null)
        .map(g => ({display: g.display, pm25: g.pm25, window: g.window}))
        .sort((a, b) => b.pm25 - a.pm25);
      if (!ranked.length)
        return "I couldn't rank cities right now — the live feed didn't return usable city data. Try asking about a specific city instead.";
      const top = intent.order === "worst" ? ranked.slice(0, 5) : ranked.slice(-5).reverse();
      const lines = [intent.order === "worst"
        ? "😷 Most polluted cities right now (mean PM2.5):"
        : "🌿 Cleanest cities right now (mean PM2.5):"];
      top.forEach((r, i) => {
        const a = aqiFrom(r.pm25, null);
        lines.push(`${i + 1}. ${a ? a.emoji : "•"} ${r.display}: ${r.pm25} µg/m³${WTAG[r.window]}`);
      });
      const mixed = new Set(top.map(r => r.window)).size > 1;
      lines.push(mixed
        ? "Each city uses its freshest available window (5-min, hourly, or 24-hour), so some rows cover different time windows."
        : "Based on the latest averages from the sensors.africa network.");
      return lines.join("\n");
    }

    default:
      return "I'm not sure how to answer that one.\n\n" + HELP_TEXT;
  }
}

/* ---------- UI wiring ---------- */

const chat = document.getElementById("chat");
const form = document.getElementById("composer");
const box = document.getElementById("box");
const send = form.querySelector("button");

function add(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

async function ask(message) {
  add(message, "user");
  const typing = add("checking the sensors…", "bot typing");
  send.disabled = true;
  try {
    const reply = await answer(message);
    typing.remove();
    add(reply, "bot");
  } catch (err) {
    typing.remove();
    if (err && err.kind === "cors") {
      add("⚠️ The sensors.africa API blocked a cross-origin (CORS) request from this page, so I can't load live data in the browser. " +
          "This is a CORS setting on api.sensors.africa, not a problem with your connection. " +
          "(Technical detail: the request to " + (err.url || "the API") + " was rejected before any response.)", "bot");
    } else if (err && err.kind === "http") {
      add("The sensors.africa API returned an error (HTTP " + err.status + ") for " + (err.url || "the data endpoint") +
          ". The service may be temporarily unavailable — please try again shortly.", "bot");
    } else {
      add("I couldn't reach the sensors.africa data service (" + (err && err.message || "network error") +
          "). Please check your connection and try again in a moment.", "bot");
    }
  } finally {
    send.disabled = false;
    box.focus();
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const message = box.value.trim();
  if (!message) return;
  box.value = "";
  ask(message);
});

document.getElementById("chips").addEventListener("click", e => {
  if (e.target.classList.contains("chip")) ask(e.target.textContent);
});

// Build city-specific suggestion chips from cities that actually have data
// (freshest window per city, highest-traffic first) and insert them before the
// always-safe chips. Fire-and-forget so the UI never waits on the network; on
// any fetch failure the safe chips are left as-is.
async function buildCityChips() {
  let merged;
  try { merged = await combinedCityMap(); }
  catch (e) { return; }  // CORS/network/etc. — keep only the safe chips
  const cities = [...merged.values()]
    .filter(g => g.pm25 != null || g.pm10 != null)
    .sort((a, b) => (b.sensors - a.sensors) || a.display.localeCompare(b.display));
  if (!cities.length) return;  // data loaded but no city has readings
  const a = cities[0].display;
  const b = cities.length > 1 ? cities[1].display : null;  // two highest-traffic
  const texts = [
    `Air quality in ${a}`,
    `Is it safe for kids to walk to school in ${b || a}?`,
  ];
  if (b) texts.push(`Compare ${a} and ${b}`);
  const container = document.getElementById("chips");
  const anchor = container.firstElementChild;  // first always-safe chip
  for (const text of texts) {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = text;
    container.insertBefore(btn, anchor);  // successive inserts keep source order
  }
}

add('👋 Hello! I turn live air-quality data from sensors across African cities ' +
    'into plain answers — right here in your browser. Try a suggestion below, or ' +
    'ask me anything — like "Is it safe to run in Nairobi today?"', "bot");

buildCityChips();  // async — swaps in city chips when data arrives, never blocks

// Shareable questions: .../index.html?q=air+quality+in+nairobi
const q = PARAMS.get("q");
if (q) ask(q);
</script>
</body>
</html>
